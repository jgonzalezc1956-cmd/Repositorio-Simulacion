<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ClayVision Trainer v0.01</title>

<style>

html,body{
    margin:0;
    overflow:hidden;
    background:#2f6f2f;
}

canvas{
    display:block;
}

</style>

</head>

<body>

<canvas id="cv"></canvas>

<script>

const canvas=document.getElementById("cv");
const ctx=canvas.getContext("2d");

function resize(){

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;

}

window.addEventListener("resize",resize);
resize();


//-------------------------------------------
// CONFIGURACIÓN
//-------------------------------------------

const RADIO_PLATO=8;          // píxeles (lo ajustaremos)
const RADIO_PUNTO=4;

const VELOCIDAD=700;          // píxeles/segundo

const ESPERA_MIN=6000;
const ESPERA_MAX=8000;


//-------------------------------------------

let plato={
    x:-100,
    y:canvas.height*0.45,
    visible:false
};

let impacto={
    x:0,
    y:0
};

let ultimo=performance.now();

let esperando=true;

let temporizador=3000;


//-------------------------------------------

function lanzar(){

    plato.visible=true;

    plato.x=-80;

    plato.y=canvas.height*0.45;

}


function actualizar(dt){

    if(plato.visible){

        plato.x+=VELOCIDAD*dt;

        // Punto de intercepción (provisional)

        impacto.x=plato.x+80;

        impacto.y=plato.y;

        if(plato.x>canvas.width+100){

            plato.visible=false;

            esperando=true;

            temporizador=
                ESPERA_MIN+
                Math.random()*(ESPERA_MAX-ESPERA_MIN);

        }

    }
    else{

        if(esperando){

            temporizador-=dt*1000;

            if(temporizador<=0){

                esperando=false;

                lanzar();

            }

        }

    }

}


function dibujar(){

    ctx.fillStyle="#2f6f2f";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    if(plato.visible){

        // Punto blanco

        ctx.beginPath();
        ctx.arc(
            impacto.x,
            impacto.y,
            RADIO_PUNTO,
            0,
            Math.PI*2
        );

        ctx.fillStyle="white";
        ctx.fill();

        // Plato rojo

        ctx.beginPath();
        ctx.arc(
            plato.x,
            plato.y,
            RADIO_PLATO,
            0,
            Math.PI*2
        );

        ctx.fillStyle="red";
        ctx.fill();

    }

}


function loop(t){

    let dt=(t-ultimo)/1000;

    ultimo=t;

    actualizar(dt);

    dibujar();

    requestAnimationFrame(loop);

}

requestAnimationFrame(loop);

</script>

</body>
</html>
