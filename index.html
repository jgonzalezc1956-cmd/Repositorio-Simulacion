<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="cache-control" content="no-cache, must-revalidate, post-check=0, pre-check=0">
<title>ClayVision Trainer v0.14 (Diagonal Recta)</title>

<style>
html, body {
    margin: 0;
    overflow: hidden;
    background: #2f6f2f;
    font-family: sans-serif;
}
canvas {
    display: block;
}
</style>
</head>

<body>

<canvas id="cv" data-version="1414"></canvas>

<script>
const canvas = document.getElementById("cv");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

//-------------------------------------------
// ⚙️ VARIABLES EDITABLES DESDE GITHUB
//-------------------------------------------
const VELOCIDAD_PLATO = 400;   // ◄ MODIFICA ESTE NÚMERO PARA CAMBIAR LA VELOCIDAD (Más alto = más rápido)
const TIEMPO_CICLO = 5000;     // Tiempo de espera entre platos (en milisegundos)

// Ajustes visuales de entrenamiento
const RADIO_PUNTO_BASE = 20;   // Punto amarillo gigante
const RADIO_PLATO_MAX = 11;    // Plato rojo pequeño
const RADIO_PLATO_MIN = 6;     
const TIEMPO_PULL = 1500;      
const FACTOR_ADELANTO = 0.16;  
const ALTURA_HORIZONTE_FACTOR = 0.65; 

//-------------------------------------------
let plato = { x: 0, y: 0, vx: 0, vy: 0, progreso: 0, visible: false };
let impacto = { x: 0, y: 0 };
let ultimo = performance.now();
let esperando = true;
let temporizador = TIEMPO_CICLO;
let mostrarPullText = false;

//-------------------------------------------
function lanzar() {
    plato.visible = true;
    mostrarPullText = false;
    plato.progreso = 0;

    // Posición inicial: Esquina inferior derecha
    plato.x = canvas.width + 20;
    plato.y = canvas.height * 0.9;

    // CÁLCULO DE LÍNEA RECTA DIAGONAL HACIA LA ESQUINA SUPERIOR IZQUIERDA
    // Apuntamos al 10% del ancho (izquierda) y al 10% del alto (arriba)
    const destinoX = canvas.width * 0.1;
    const destinoY = canvas.height * 0.1;

    // Vector de dirección
    const dx = destinoX - plato.x;
    const dy = destinoY - plato.y;
    const distancia = Math.sqrt(dx * dx + dy * dy);

    // Velocidades fijas basadas en tu variable superior (Sin variaciones aleatorias)
    plato.vx = (dx / distancia) * VELOCIDAD_PLATO;
    plato.vy = (dy / distancia) * VELOCIDAD_PLATO;
}

function actualizar(dt) {
    if (plato.visible) {
        // Movimiento rectilíneo uniforme puro (Sin gravedad)
        plato.x += plato.vx * dt;
        plato.y += plato.vy * dt;
        
        // Simulación visual de lejanía progresiva
        plato.progreso = Math.min(1, plato.progreso + dt / 2.2);

        // Adelanto dinámico en línea recta
        impacto.x = plato.x + (plato.vx * FACTOR_ADELANTO);
        impacto.y = plato.y + (plato.vy * FACTOR_ADELANTO);

        // Desaparece al rebasar el margen izquierdo superior
        if (plato.x < -100 || plato.y < -100) {
            plato.visible = false;
            esperando = true;
            temporizador = TIEMPO_CICLO;
        }
    } else {
        if (esperando) {
            temporizador -= dt * 1000;

            if (temporizador <= TIEMPO_PULL) {
                mostrarPullText = true;
            }

            if (temporizador <= 0) {
                esperando = false;
                lanzar();
            }
        }
    }
}

function dibujar() {
    const altoHorizonte = canvas.height * ALTURA_HORIZONTE_FACTOR;

    // Escenario
    ctx.fillStyle = "#aed8f2";
    ctx.fillRect(0, 0, canvas.width, altoHorizonte);
    ctx.fillStyle = "#2f6f2f";
    ctx.fillRect(0, altoHorizonte, canvas.width, canvas.height - altoHorizonte);

    // Horizonte
    ctx.strokeStyle = "#1d471d";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, altoHorizonte);
    ctx.lineTo(canvas.width, altoHorizonte);
    ctx.stroke();

    // COLOR TESTIGO NUEVO: Blanco puro para saber que es la versión de línea recta diagonal
    if (mostrarPullText) {
        ctx.fillStyle = "#ffffff"; 
        ctx.font = "bold 75px sans-serif"; 
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("¡PULL!", canvas.width / 2, canvas.height * 0.35);
    }

    if (plato.visible) {
        const radioPlatoActual = RADIO_PLATO_MAX - (plato.progreso * (RADIO_PLATO_MAX - RADIO_PLATO_MIN));
        const radioPuntoActual = RADIO_PUNTO_BASE * (radioPlatoActual / RADIO_PLATO_MAX);

        // Punto amarillo gigante con borde negro
        ctx.beginPath();
        ctx.arc(impacto.x, impacto.y, radioPuntoActual, 0, Math.PI * 2);
        ctx.fillStyle = "#ffff00"; 
        ctx.fill();
        ctx.strokeStyle = "#000000"; 
        ctx.lineWidth = 2;
        ctx.stroke();

        // Plato rojo reducido
        ctx.beginPath();
        ctx.ellipse(plato.x, plato.y, radioPlatoActual * 1.3, radioPlatoActual * 0.7, 0, 0, Math.PI * 2);
        ctx.fillStyle = "#ff4500"; 
        ctx.fill();
        ctx.strokeStyle = "#b33000";
        ctx.lineWidth = Math.max(1, radioPlatoActual * 0.15);
        ctx.stroke();
    }
}

function loop(t) {
    let dt = (t - ultimo) / 1000;
    ultimo = t;
    if (dt > 0.1) dt = 0.1;
    actualizar(dt);
    dibujar();
    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
