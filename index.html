<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Línea anti-caché para la tele -->
<meta http-equiv="cache-control" content="no-cache, must-revalidate, post-check=0, pre-check=0">
<title>ClayVision Trainer v0.08 (Suave)</title>

<style>
html, body {
    margin: 0;
    overflow: hidden;
    background: #2f6f2f;
    font-family: sans-serif;
}
canvas {
    display: block;
}
</style>
</head>

<body>

<canvas id="cv" data-version="888"></canvas>

<script>
const canvas = document.getElementById("cv");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

//-------------------------------------------
// CONFIGURACIÓN CALIBRADA (MÁS DESPACIO)
//-------------------------------------------
const RADIO_PLATO_MAX = 22;    
const RADIO_PLATO_MIN = 10;    
const RADIO_PUNTO_BASE = 5.5;  

const GRAVEDAD = 380;          // Bajada de 500 a 380 para que el plato flote más al ir más lento
const TIEMPO_CICLO = 5000;     // Se mantienen los 5 segundos de ciclo
const TIEMPO_PULL = 1500;      
const FACTOR_ADELANTO = 0.16;  

const ALTURA_HORIZONTE_FACTOR = 0.65; 

//-------------------------------------------
let plato = {
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    progreso: 0,               
    visible: false
};

let impacto = { x: 0, y: 0 };
let ultimo = performance.now();
let esperando = true;
let temporizador = TIEMPO_CICLO;
let mostrarPullText = false;

//-------------------------------------------
function lanzar() {
    plato.visible = true;
    mostrarPullText = false;
    plato.progreso = 0;

    const lado = Math.random() < 0.5 ? 0 : 1;

    if (lado === 0) {
        plato.x = -20;
        plato.y = canvas.height * 0.9;
        
        // VELOCIDADES REDUCIDAS (Antes multiplicaban por 0.45 y 0.8)
        plato.vx = canvas.width * (0.35 + Math.random() * 0.12); // Más lento horizontalmente
        plato.vy = -(canvas.height * (0.65 + Math.random() * 0.12)); // Sube con menos fuerza
    } else {
        plato.x = canvas.width + 20;
        plato.y = canvas.height * 0.9;
        
        // VELOCIDADES REDUCIDAS INVERTIDAS
        plato.vx = -canvas.width * (0.35 + Math.random() * 0.12);
        plato.vy = -(canvas.height * (0.65 + Math.random() * 0.12));
    }
}

function actualizar(dt) {
    if (plato.visible) {
        plato.vy += GRAVEDAD * dt;
        plato.x += plato.vx * dt;
        plato.y += plato.vy * dt;
        
        // Ajustado el tiempo de vuelo estimado a 2.2 segundos porque ahora tarda más en cruzar
        plato.progreso = Math.min(1, plato.progreso + dt / 2.2);

        impacto.x = plato.x + (plato.vx * FACTOR_ADELANTO);
        impacto.y = plato.y + (plato.vy * FACTOR_ADELANTO);

        if (plato.x < -150 || plato.x > canvas.width + 150 || plato.y > canvas.height + 50) {
            plato.visible = false;
            esperando = true;
            temporizador = TIEMPO_CICLO;
        }
    } else {
        if (esperando) {
            temporizador -= dt * 1000;

            if (temporizador <= TIEMPO_PULL) {
                mostrarPullText = true;
            }

            if (temporizador <= 0) {
                esperando = false;
                lanzar();
            }
        }
    }
}

function dibujar() {
    const altoHorizonte = canvas.height * ALTURA_HORIZONTE_FACTOR;

    ctx.fillStyle = "#aed8f2";
    ctx.fillRect(0, 0, canvas.width, altoHorizonte);

    ctx.fillStyle = "#2f6f2f";
    ctx.fillRect(0, altoHorizonte, canvas.width, canvas.height - altoHorizonte);

    ctx.strokeStyle = "#1d471d";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, altoHorizonte);
    ctx.lineTo(canvas.width, altoHorizonte);
    ctx.stroke();

    if (mostrarPullText) {
        ctx.fillStyle = "rgba(40, 40, 40, 0.8)";
        ctx.font = "bold 75px sans-serif"; 
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("¡PULL!", canvas.width / 2, canvas.height * 0.35);
    }

    if (plato.visible) {
        const radioPlatoActual = RADIO_PLATO_MAX - (plato.progreso * (RADIO_PLATO_MAX - RADIO_PLATO_MIN));
        const radioPuntoActual = RADIO_PUNTO_BASE * (radioPlatoActual / RADIO_PLATO_MAX);

        // Punto de anticipación amarillo fosforito
        ctx.beginPath();
        ctx.arc(impacto.x, impacto.y, radioPuntoActual, 0, Math.PI * 2);
        ctx.fillStyle = "#ffff00"; 
        ctx.fill();
        
        ctx.strokeStyle = "#000000"; 
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Plato naranja
        ctx.beginPath();
        ctx.ellipse(plato.x, plato.y, radioPlatoActual * 1.3, radioPlatoActual * 0.7, 0, 0, Math.PI * 2);
        ctx.fillStyle = "#ff4500"; 
        ctx.fill();
        
        ctx.strokeStyle = "#b33000";
        ctx.lineWidth = Math.max(1.5, radioPlatoActual * 0.15);
        ctx.stroke();
    }
}

function loop(t) {
    let dt = (t - ultimo) / 1000;
    ultimo = t;

    if (dt > 0.1) dt = 0.1;

    actualizar(dt);
    dibujar();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
