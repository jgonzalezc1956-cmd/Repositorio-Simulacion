<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ClayVision Trainer v0.02</title>

<style>
html, body {
    margin: 0;
    overflow: hidden;
    background: #2f6f2f;
    font-family: sans-serif;
}
canvas {
    display: block;
}
</style>
</head>

<body>

<canvas id="cv"></canvas>

<script>
const canvas = document.getElementById("cv");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

//-------------------------------------------
// CONFIGURACIÓN AJUSTADA
//-------------------------------------------
const RADIO_PLATO = 10;        // Un poco más grande para visibilidad en TV
const RADIO_PUNTO = 4;
const GRAVEDAD = 450;          // Píxeles/segundo al cuadrado (afecta la caída)
const TIEMPO_CICLO = 5000;     // Ciclo estricto de 5 segundos (en milisegundos)
const TIEMPO_PULL = 1500;      // Cuánto tiempo se muestra el aviso "PULL" antes de lanzar
const FACTOR_ADELANTO = 0.15;  // Multiplicador físico de velocidad para el punto de anticipación

//-------------------------------------------
let plato = {
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    visible: false
};

let impacto = { x: 0, y: 0 };
let ultimo = performance.now();
let esperando = true;
let temporizador = TIEMPO_CICLO;
let mostrarPullText = false;

//-------------------------------------------
function lanzar() {
    plato.visible = true;
    mostrarPullText = false;

    // Decide aleatoriamente si sale de la izquierda (0) o de la derecha (1)
    const lado = Math.random() < 0.5 ? 0 : 1;

    if (lado === 0) {
        // Esquina inferior izquierda
        plato.x = 0;
        plato.y = canvas.height;
        // Velocidades iniciales calculadas dinámicamente según la pantalla
        plato.vx = canvas.width * 0.45 + Math.random() * (canvas.width * 0.15);
        plato.vy = -(canvas.height * 0.75 + Math.random() * (canvas.height * 0.15));
    } else {
        // Esquina inferior derecha
        plato.x = canvas.width;
        plato.y = canvas.height;
        plato.vx = -(canvas.width * 0.45 + Math.random() * (canvas.width * 0.15));
        plato.vy = -(canvas.height * 0.75 + Math.random() * (canvas.height * 0.15));
    }
}

function actualizar(dt) {
    if (plato.visible) {
        // Aplicar gravedad física a la velocidad vertical
        plato.vy += GRAVEDAD * dt;

        // Actualizar posiciones
        plato.x += plato.vx * dt;
        plato.y += plato.vy * dt;

        // PUNTO DE ANTICIPACIÓN DINÁMICO
        // Varía según el vector de velocidad actual (vx, vy) multiplicada por el factor de reacción
        impacto.x = plato.x + (plato.vx * FACTOR_ADELANTO);
        impacto.y = plato.y + (plato.vy * FACTOR_ADELANTO);

        // Desaparece si sale de los límites de la pantalla
        if (plato.x < -50 || plato.x > canvas.width + 50 || plato.y > canvas.height + 50) {
            plato.visible = false;
            esperando = true;
            temporizador = TIEMPO_CICLO;
        }
    } else {
        if (esperando) {
            temporizador -= dt * 1000;

            // Activa el aviso "PULL" visual cuando falte poco tiempo para el lanzamiento
            if (temporizador <= TIEMPO_PULL) {
                mostrarPullText = true;
            }

            if (temporizador <= 0) {
                esperando = false;
                lanzar();
            }
        }
    }
}

function dibujar() {
    // Fondo verde cancha
    ctx.fillStyle = "#2f6f2f";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Dibujar texto "PULL" simulando la petición del tirador
    if (mostrarPullText) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
        ctx.font = "bold 64px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("¡PULL!", canvas.width / 2, canvas.height / 2);
    }

    if (plato.visible) {
        // Punto blanco dinámico (Adelanto calculado)
        ctx.beginPath();
        ctx.arc(impacto.x, impacto.y, RADIO_PUNTO, 0, Math.PI * 2);
        ctx.fillStyle = "white";
        ctx.fill();

        // Plato naranja/rojo tradicional
        ctx.beginPath();
        ctx.arc(plato.x, plato.y, RADIO_PLATO, 0, Math.PI * 2);
        ctx.fillStyle = "#ff4500"; // Naranja de alta visibilidad para tiro
        ctx.fill();
        
        // Borde del plato para darle volumen visual
        ctx.strokeStyle = "#b33000";
        ctx.lineWidth = 2;
        ctx.stroke();
    }
}

function loop(t) {
    let dt = (t - ultimo) / 1000;
    ultimo = t;

    // Limitar el dt máximo para evitar saltos bruscos si la TV reduce frames
    if (dt > 0.1) dt = 0.1;

    actualizar(dt);
    dibujar();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
