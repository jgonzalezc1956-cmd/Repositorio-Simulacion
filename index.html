<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ClayVision Trainer v0.03</title>

<style>
html, body {
    margin: 0;
    overflow: hidden;
    background: #2f6f2f;
    font-family: sans-serif;
}
canvas {
    display: block;
}
</style>
</head>

<body>

<canvas id="cv"></canvas>

<script>
const canvas = document.getElementById("cv");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

//-------------------------------------------
// CONFIGURACIÓN AJUSTADA PARA PARÁBOLAS REALES
//-------------------------------------------
const RADIO_PLATO = 11;        // Ajustado para TV de 50"
const RADIO_PUNTO = 4;
const GRAVEDAD = 600;          // Gravedad más alta para obligar al plato a caer de forma natural
const TIEMPO_CICLO = 5000;     
const TIEMPO_PULL = 1500;      
const FACTOR_ADELANTO = 0.16;  

//-------------------------------------------
let plato = {
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    visible: false
};

let impacto = { x: 0, y: 0 };
let ultimo = performance.now();
let esperando = true;
let temporizador = TIEMPO_CICLO;
let mostrarPullText = false;

//-------------------------------------------
function lanzar() {
    plato.visible = true;
    mostrarPullText = false;

    // Alternar lado de salida: 0 = Izquierda, 1 = Derecha
    const lado = Math.random() < 0.5 ? 0 : 1;

    if (lado === 0) {
        // Esquina inferior izquierda (con un pequeño margen hacia el centro)
        plato.x = canvas.width * 0.05;
        plato.y = canvas.height;
        
        // CÁLCULO ALEATORIO DE TRAYECTORIA (Foso/Skeet simulado)
        // vx controla qué tan lejos llega hacia la derecha
        plato.vx = canvas.width * (0.35 + Math.random() * 0.25);
        // vy controla la altura del disparo vertical
        plato.vy = -(canvas.height * (0.85 + Math.random() * 0.20));
    } else {
        // Esquina inferior derecha (con un pequeño margen hacia el centro)
        plato.x = canvas.width * 0.95;
        plato.y = canvas.height;
        
        // Lo mismo pero invertido hacia la izquierda
        plato.vx = -canvas.width * (0.35 + Math.random() * 0.25);
        plato.vy = -(canvas.height * (0.85 + Math.random() * 0.20));
    }
}

function actualizar(dt) {
    if (plato.visible) {
        // Aplicar gravedad constante al vector vertical
        plato.vy += GRAVEDAD * dt;

        // Actualizar posiciones físicas
        plato.x += plato.vx * dt;
        plato.y += plato.vy * dt;

        // Punto de anticipación dinámico basado en la velocidad de ese instante
        impacto.x = plato.x + (plato.vx * FACTOR_ADELANTO);
        impacto.y = plato.y + (plato.vy * FACTOR_ADELANTO);

        // El plato muere si cae al suelo o sale demasiado de los límites laterales
        if (plato.x < -100 || plato.x > canvas.width + 100 || plato.y > canvas.height + 50) {
            plato.visible = false;
            esperando = true;
            temporizador = TIEMPO_CICLO;
        }
    } else {
        if (esperando) {
            temporizador -= dt * 1000;

            if (temporizador <= TIEMPO_PULL) {
                mostrarPullText = true;
            }

            if (temporizador <= 0) {
                esperando = false;
                lanzar();
            }
        }
    }
}

function dibujar() {
    ctx.fillStyle = "#2f6f2f";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (mostrarPullText) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
        ctx.font = "bold 70px sans-serif"; // Ligeramente más grande para la TV
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("¡PULL!", canvas.width / 2, canvas.height / 2);
    }

    if (plato.visible) {
        // Punto blanco (Adelanto)
        ctx.beginPath();
        ctx.arc(impacto.x, impacto.y, RADIO_PUNTO, 0, Math.PI * 2);
        ctx.fillStyle = "white";
        ctx.fill();

        // Plato naranja de alta visibilidad
        ctx.beginPath();
        ctx.arc(plato.x, plato.y, RADIO_PLATO, 0, Math.PI * 2);
        ctx.fillStyle = "#ff4500"; 
        ctx.fill();
        
        ctx.strokeStyle = "#b33000";
        ctx.lineWidth = 2.5;
        ctx.stroke();
    }
}

function loop(t) {
    let dt = (t - ultimo) / 1000;
    ultimo = t;

    if (dt > 0.1) dt = 0.1;

    actualizar(dt);
    dibujar();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
