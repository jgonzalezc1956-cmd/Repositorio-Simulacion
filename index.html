<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="cache-control" content="no-cache, must-revalidate, post-check=0, pre-check=0">
<title>ClayVision Trainer v0.13 (Entrenamiento Visual)</title>

<style>
html, body {
    margin: 0;
    overflow: hidden;
    background: #2f6f2f;
    font-family: sans-serif;
}
canvas {
    display: block;
}
</style>
</head>

<body>

<canvas id="cv" data-version="1313"></canvas>

<script>
const canvas = document.getElementById("cv");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

//-------------------------------------------
// CONFIGURACIÓN (INVERSIÓN VISUAL PARA ENTRENAMIENTO)
//-------------------------------------------
const RADIO_PUNTO_BASE = 26;   // ¡GIGANTE! El punto de anticipación amarillo es el doble de grande
const RADIO_PLATO_MAX = 11;    // Reducido a la mitad para que no llame tanto la atención
const RADIO_PLATO_MIN = 6;     

const GRAVEDAD = 930;          
const TIEMPO_CICLO = 8000;     // 8 segundos de descanso
const TIEMPO_PULL = 1500;      
const FACTOR_ADELANTO = 0.16;  

const ALTURA_HORIZONTE_FACTOR = 0.65; 

//-------------------------------------------
let plato = {
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    progreso: 0,               
    visible: false
};

let impacto = { x: 0, y: 0 };
let ultimo = performance.now();
let esperando = true;
let temporizador = TIEMPO_CICLO;
let mostrarPullText = false;

// Variable testigo para alternar lados de forma estricta (false = izquierda, true = derecha)
let alternarLado = false;

//-------------------------------------------
function lanzar() {
    plato.visible = true;
    mostrarPullText = false;
    plato.progreso = 0;

    // Cambia estrictamente de lado en cada tiro
    if (!alternarLado) {
        // Sale por la Izquierda
        plato.x = -20;
        plato.y = canvas.height * 0.9;
        plato.vx = canvas.width * (0.38 + Math.random() * 0.12); 
        plato.vy = -(canvas.height * (1.18 + Math.random() * 0.15)); 
        alternarLado = true; // El siguiente irá a la derecha
    } else {
        // Sale por la Derecha
        plato.x = canvas.width + 20;
        plato.y = canvas.height * 0.9;
        plato.vx = -canvas.width * (0.38 + Math.random() * 0.12);
        plato.vy = -(canvas.height * (1.18 + Math.random() * 0.15));
        alternarLado = false; // El siguiente volverá a la izquierda
    }
}

function actualizar(dt) {
    if (plato.visible) {
        plato.vy += GRAVEDAD * dt;
        plato.x += plato.vx * dt;
        plato.y += plato.vy * dt;
        
        plato.progreso = Math.min(1, plato.progreso + dt / 2.5);

        impacto.x = plato.x + (plato.vx * FACTOR_ADELANTO);
        impacto.y = plato.y + (plato.vy * FACTOR_ADELANTO);

        if (plato.x < -150 || plato.x > canvas.width + 150 || plato.y > canvas.height + 50) {
            plato.visible = false;
            esperando = true;
            temporizador = TIEMPO_CICLO;
        }
    } else {
        if (esperando) {
            temporizador -= dt * 1000;

            if (temporizador <= TIEMPO_PULL) {
                mostrarPullText = true;
            }

            if (temporizador <= 0) {
                esperando = false;
                lanzar();
            }
        }
    }
}

function dibujar() {
    const altoHorizonte = canvas.height * ALTURA_HORIZONTE_FACTOR;

    // Cielo
    ctx.fillStyle = "#aed8f2";
    ctx.fillRect(0, 0, canvas.width, altoHorizonte);

    // Suelo
    ctx.fillStyle = "#2f6f2f";
    ctx.fillRect(0, altoHorizonte, canvas.width, canvas.height - altoHorizonte);

    // Horizonte
    ctx.strokeStyle = "#1d471d";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, altoHorizonte);
    ctx.lineTo(canvas.width, altoHorizonte);
    ctx.stroke();

    // NUEVO COLOR TESTIGO: Aviso "PULL" en color ROSA FOSFORITO
    if (mostrarPullText) {
        ctx.fillStyle = "#ff007f"; 
        ctx.font = "bold 75px sans-serif"; 
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("¡PULL!", canvas.width / 2, canvas.height * 0.35);
    }

    if (plato.visible) {
        const radioPlatoActual = RADIO_PLATO_MAX - (plato.progreso * (RADIO_PLATO_MAX - RADIO_PLATO_MIN));
        
        // El tamaño del punto amarillo también se adapta suavemente a la profundidad pero partiendo de su escala gigante
        const radioPuntoActual = RADIO_PUNTO_BASE * (radioPlatoActual / RADIO_PLATO_MAX);

        // 1. DIBUJAR PUNTO DE ANTICIPACIÓN AMARILLO GIGANTE (Con borde negro grueso)
        ctx.beginPath();
        ctx.arc(impacto.x, impacto.y, radioPuntoActual, 0, Math.PI * 2);
        ctx.fillStyle = "#ffff00"; 
        ctx.fill();
        
        ctx.strokeStyle = "#000000"; 
        ctx.lineWidth = 2; // Borde más grueso para máxima definición
        ctx.stroke();

        // 2. DIBUJAR PLATO ROJO PEQUEÑO
        ctx.beginPath();
        ctx.ellipse(plato.x, plato.y, radioPlatoActual * 1.3, radioPlatoActual * 0.7, 0, 0, Math.PI * 2);
        ctx.fillStyle = "#ff4500"; 
        ctx.fill();
        
        ctx.strokeStyle = "#b33000";
        ctx.lineWidth = Math.max(1, radioPlatoActual * 0.15);
        ctx.stroke();
    }
}

function loop(t) {
    let dt = (t - ultimo) / 1000;
    ultimo = t;

    if (dt > 0.1) dt = 0.1;

    actualizar(dt);
    dibujar();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
